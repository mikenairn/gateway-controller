apiVersion: praxis.io/v1alpha1
kind: Policy
metadata:
  name: llm-guardrails
  namespace: praxis-system
spec:
  document: |
    version: "1"
    identity:
      - name: api-key
        type: api_key
        header: x-api-key
        jwks_uri: https://auth.example.com/.well-known/jwks.json
    routes:
      llm:
        - match:
            model: ["gpt-4o", "gpt-4o-mini", "claude-sonnet-4-20250514"]
          require:
            perm.use_llm: true
          actions:
            - set:
                args.max_tokens: 4096
    rules:
      - name: block-pii
        match:
          args.messages.*.content: contains("SSN")
        action: deny
        message: "PII detected in request"
  filter:
    bodyAccess: read_write
    initTimeoutSeconds: 60
    maxBufferBytes: 20971520
    allowPrivateIdp: false
    trustedPrivateEndpoints:
      - "auth.internal.example.com"
      - "vault.internal.example.com"
    requireProtocolMetadata: true
    llm:
      maxRequestBytes: 5242880
      promoteParams:
        - stream
        - max_tokens
        - max_completion_tokens
        - temperature
        - top_p
        - n
      provider: openai
      requireModel: true
      requireRoute: true
    contextHeaders:
      agent.conversation_id: x-ext-agent-conversation-id
      agent.turn: x-ext-agent-turn
      agent.agent_id: x-ext-agent-id
      agent.parent_agent_id: x-ext-agent-parent-id
      agent.input: x-ext-agent-input
      framework.framework: x-ext-agent-framework
      framework.framework_version: x-ext-agent-framework-version
      framework.node_id: x-ext-agent-framework-node
      framework.graph_id: x-ext-agent-framework-graph
    contextMeta:
      tags:
        - regulated
        - tier-1
        - production
      scope: production
      properties:
        team: compliance
        region: eu-west-1
        environment: prod
