kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - aigateway.praxis.io
  resources:
  - aigateways
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - aigateway.praxis.io
  resources:
  - aigateways/finalizers
  verbs:
  - update
- apiGroups:
  - aigateway.praxis.io
  resources:
  - aigateways/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - praxis.io
  resources:
  - policies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - praxis.io
  resources:
  - policies/status
  - proxies/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - praxis.io
  resources:
  - proxies
