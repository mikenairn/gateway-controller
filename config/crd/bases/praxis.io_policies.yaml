---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: policies.praxis.io
spec:
  group: praxis.io
  names:
    kind: Policy
    listKind: PolicyList
    plural: policies
    singular: policy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Policy is a reusable Policy Engine document. A chain activates it;
          the controller manages the policy file and generates config_path.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PolicySpec defines a Praxis Policy Engine document and native
              filter options.
            properties:
              document:
                description: document is the Praxis Policy Engine document as a YAML
                  string.
                minLength: 1
                type: string
              filter:
                description: filter provides typed options for the native policy filter.
                properties:
                  allowPrivateIdp:
                    default: false
                    description: allowPrivateIdp requires an explicitly authorized
                      runtime capability.
                    type: boolean
                  bodyAccess:
                    default: read_only
                    description: 'bodyAccess controls body access mode: read_only
                      (default) or read_write.'
                    enum:
                    - read_only
                    - read_write
                    type: string
                  contextHeaders:
                    additionalProperties:
                      type: string
                    description: |-
                      contextHeaders maps extension field names to HTTP header names for populating
                      host-supplied context slots. Valid keys: agent.conversation_id, agent.turn,
                      agent.agent_id, agent.parent_agent_id, agent.input, framework.framework,
                      framework.framework_version, framework.node_id, framework.graph_id.
                      Values must use a reserved header prefix (x-praxis-*, x-ext-agent-*, x-ext-protocol-*).
                    type: object
                  contextMeta:
                    description: |-
                      contextMeta provides static operator-supplied metadata merged into the policy engine's
                      meta extension slot on every request.
                    properties:
                      properties:
                        additionalProperties:
                          type: string
                        description: properties are arbitrary key-value metadata available
                          as meta.properties.<key> in APL predicates.
                        type: object
                      scope:
                        description: scope is a host-defined grouping used by the
                          PPE for route resolution.
                        type: string
                      tags:
                        description: tags are operational tags available as meta.tags
                          in policy rules.
                        items:
                          type: string
                        type: array
                    type: object
                  initTimeoutSeconds:
                    default: 30
                    description: initTimeoutSeconds is the policy initialization timeout.
                    format: int32
                    minimum: 1
                    type: integer
                  llm:
                    description: llm provides inference policy options.
                    properties:
                      maxRequestBytes:
                        description: maxRequestBytes is the positive request limit;
                          defaults to maxBufferBytes.
                        format: int64
                        minimum: 1
                        type: integer
                      promoteParams:
                        description: promoteParams lists request fields promoted to
                          policy metadata.
                        items:
                          type: string
                        type: array
                      provider:
                        description: provider is an operator-supplied provider value
                          exposed to policy rules.
                        type: string
                      requireModel:
                        default: true
                        description: requireModel denies inference requests without
                          a usable model.
                        type: boolean
                      requireRoute:
                        default: true
                        description: requireRoute denies models not selected by a
                          policy route.
                        type: boolean
                    type: object
                  maxBufferBytes:
                    default: 10485760
                    description: maxBufferBytes is the request/response buffer ceiling
                      in write mode.
                    format: int64
                    minimum: 1
                    type: integer
                  requireProtocolMetadata:
                    default: true
                    description: requireProtocolMetadata maps to the native classifier
                      check.
                    type: boolean
                  trustedPrivateEndpoints:
                    description: |-
                      trustedPrivateEndpoints lists hosts the policy engine may reach at private (RFC 1918) addresses.
                      Narrower than allowPrivateIdp: only listed hosts may resolve to non-public addresses.
                    items:
                      type: string
                    type: array
                type: object
            required:
            - document
            type: object
          status:
            description: PraxisDefinitionStatus is the shared status for Policy.
            properties:
              conditions:
                description: conditions report Accepted (valid specification) and
                  ResolvedRefs (available and authorized dependencies).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              effectiveRevision:
                description: effectiveRevision is a digest of this definition and
                  its resolved transitive inputs.
                type: string
              observedGeneration:
                description: observedGeneration is the latest generation inspected
                  by this resource's controller.
                format: int64
                type: integer
              programmedBy:
                description: |-
                  programmedBy lists the proxies that have rendered this definition into their published config.
                  Each entry is "namespace/name" of a Proxy.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              usedBy:
                description: |-
                  usedBy lists the proxies that reference this definition.
                  Each entry is "namespace/name" of a Proxy.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
